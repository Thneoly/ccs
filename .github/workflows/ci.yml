name: CI

# Same matrix as ccm: CI is the verification gate for main — fmt /
# check / test / clippy plus a platform smoke over a synthetic home.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the stable channel with rustfmt + clippy;
      # rustup resolves it on the first cargo invocation.
      - name: Verify (fmt / check / test / clippy)
        if: runner.os == 'Linux'
        run: ./scripts/verify.sh

      - name: Smoke
        if: runner.os == 'Linux'
        run: ./scripts/smoke.sh

      - name: Verify (fmt / check / test / clippy)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke.ps1
